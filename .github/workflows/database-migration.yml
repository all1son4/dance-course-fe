name: Database migration
run-name: Database ${{ inputs.target }} ${{ inputs.phase }} @ ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Database environment to migrate
        required: true
        type: choice
        options:
          - development
          - production
      phase:
        description: Migration phase declared in every pending SQL file
        required: true
        type: choice
        options:
          - expand
          - contract
      confirmation:
        description: Type migrate-<target>-<phase> exactly
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: database-migration-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the target release branch
        env:
          REQUESTED_PHASE: ${{ inputs.phase }}
          REQUESTED_TARGET: ${{ inputs.target }}
          TYPED_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          expected_ref="dev"
          if [ "${REQUESTED_TARGET}" = "production" ]; then
            expected_ref="main"
          fi

          if [ "${GITHUB_REF_NAME}" != "${expected_ref}" ]; then
            echo "::error::${REQUESTED_TARGET} migrations must run from ${expected_ref}."
            exit 1
          fi

          expected_confirmation="migrate-${REQUESTED_TARGET}-${REQUESTED_PHASE}"
          if [ "${TYPED_CONFIRMATION}" != "${expected_confirmation}" ]; then
            echo "::error::Type ${expected_confirmation} exactly."
            exit 1
          fi

  build:
    name: Build artifact first
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out requested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build without migrations
        run: npm run build

  migrate:
    name: Apply ${{ inputs.phase }} migration to ${{ inputs.target }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.target == 'production' && 'Production' || 'Preview' }}

    env:
      CI: true
      HUSKY: "0"
      MIGRATION_APPROVAL: ${{ inputs.confirmation }}
      MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
      MIGRATION_PHASE: ${{ inputs.phase }}
      MIGRATION_RELEASE_REF: ${{ github.ref_name }}
      MIGRATION_TARGET: ${{ inputs.target }}

    steps:
      - name: Check out built revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require the environment database secret
        run: |
          if [ -z "${MIGRATION_DATABASE_URL}" ]; then
            echo "::error::Add DATABASE_URL_UNPOOLED to the selected GitHub Environment."
            exit 1
          fi

      - name: Apply controlled migration
        run: npm run db:migrate
