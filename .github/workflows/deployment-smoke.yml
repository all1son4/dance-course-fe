name: Deployment smoke

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: deployment-smoke-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Critical journeys
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true
      HUSKY: "0"
      PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url }}

    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.deployment.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test critical browser journeys
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.event.deployment.id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
