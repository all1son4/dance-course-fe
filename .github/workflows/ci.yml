name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dance_course_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dance_course_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dance_course_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Prepare integration database
        run: npm run test:integration:setup

      - name: Test PostgreSQL integration
        run: npm run test:integration

      - name: Rehearse logical backup and restore
        run: scripts/rehearse-database-restore.sh

      - name: Build without migrations
        run: npm run build
